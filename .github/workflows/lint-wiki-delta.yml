# Optional · wiki_delta 扫描（读 harness.pin.json · 对齐产品 ≥2.21 pin 样例）
#
# 参考：@cyning/harness ci/samples/lint-wiki-delta.pin.yml.example
# 本仓额外：先跑 check-harness-pin.mjs

name: lint-wiki-delta

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'task/**']
  workflow_dispatch:

jobs:
  lint-wiki-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check harness pin
        run: node scripts/check-harness-pin.mjs

      - name: Resolve pin
        id: pin
        run: echo "version=$(node -p "require('./harness.pin.json').version")" >> "$GITHUB_OUTPUT"

      - name: task lint-wiki-delta
        run: npx --yes "@cyning/harness@${{ steps.pin.outputs.version }}" task lint-wiki-delta --target .
