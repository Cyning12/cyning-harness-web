name: quality

on:
  push:
    branches: [main, 'task/**']
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Phase E+：挂 harness verify（版本真值：仓根 harness.pin.json；禁止 --allow-*-gap）
      # task 路径策略：
      #   - CI 默认用 docs/tasks/done/ 下已 CLOSE 样例（帽链 10/30/40 齐、闸稳定）
      #   - 勿用 active 进行中 task（可能缺 40 → 仅 WARN，但样例易漂移）
      #   - 本仓 CLOSED 样例：task_web_obs_demo_hgm_consumer_v1.md（Phase D）
      #   - graph_delta=none 的样例可不加 --graph；本步与样例一致省略
      # 本地复现：node scripts/harness-verify-ci.mjs · README「CI · harness verify」
      - name: Check harness pin
        run: node scripts/check-harness-pin.mjs

      - name: Harness verify
        run: node scripts/harness-verify-ci.mjs
